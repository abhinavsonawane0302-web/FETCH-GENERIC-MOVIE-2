            <div class=" col-md-6 text-right align-self-center">
                <button id="addMovieBtn" class="btn btn-sm bg-danger text-white"> Add Movie </button>
            </div>

        </div>
    </div>

    <div class="container-fluid">
        <div class="row" id="moviecontainer">

        </div>
    </div>

    <div class=" cancleBtn backdrop" id="backdrop"> </div>

    <div id="movieModel" class="moviemodal">
        <form id="movieForm">

            <div class="card text-black">
                <div class="card-header justify-content-between">
                    <div class="model-header">
                        <div class=" d-flex justify-content-between">
                            <h3 id="modelTitle"> Add Movie </h3>
                            <i class="fa-solid fa-xmark fa-2x" id="closeMovieModalIcon"></i>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="movieName"> Movie Name </label>
                            <input id="movieName" type="text" class="form-control" placeholder="Enter Movie Name"
                                required>

                        </div>



                        <div class="form-group col-md-6">

                            <label for="movieRating"> Rating </label>
                            <input id="movieRating" type="number" min="1" max="10" step=".1" class="form-control"
                                placeholder="Enter Movie Rating" required>

                        </div>


                    </div>

                    <div class="form-row">

                        <div class="form-group col-md-6">

                            <label for="movieImage"> Movie Image URL </label>
                            <input type="url" id="movieImage" class="form-control" placeholder="Enter image URL"
                                required>

                        </div>



                        <div class="form-group col-md-6">

                            <label for="movieDate">Movie Date</label>
                            <input id="movieDate" type="date" min="2010-01-01" max="2050-12-31" class="form-control"
                                placeholder="Enter Movie Date" required>

                        </div>


                    </div>

                    <div class="form-group">

                        <label for="movieDescription"> Description </label>
                        <textarea id="movieDescription" class="form-control" placeholder="Enter Movie Description"
                            required></textarea>

                    </div>


                </div>

                <div class=" card-footer d-flex justify-content-between">

                    <button type="submit" id="addBtn" class="btn btn-sm btn-outline-danger" id="addBtn"> Add Movie </button>
                    <button type="button"  class="btn btn-sm btn-outline-danger d-none" id="updateBtn" > Update Movie</button>
                    <button type="button"  class="btn btn-sm btn-outline-primary" id="cancleBtn"> Cancle</button>

                </div>
            </div>
        </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    </form>
    </div>
